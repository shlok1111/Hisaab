<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Hisaab is a private spending tracker. It runs in your browser and keeps your data on your device.">
<title>Hisaab Money Tracker</title>

<!-- These lines are what let a phone install the page as an app. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fdfefd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hisaab">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- This page is only the frame: a header, an empty <main>, and the tab bar.
     app.js fills <main id="view"> with whichever screen is open. -->
<header class="top">
  <div class="brand"><b>Hisaab</b><span lang="hi">हिसाब</span></div>
  <span class="status" id="status"><i></i>Opening…</span>
  <button class="icon-btn" data-act="go" data-tab="setup" aria-label="Setup and backup">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button class="tab" data-act="go" data-tab="overview"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5M3 20h18"/></svg><span>Overview</span></button>
  <button class="tab" data-act="go" data-tab="history"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>History</span></button>
  <button class="tab add" data-act="add" aria-label="Add an entry"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add entry</span></button>
  <button class="tab" data-act="go" data-tab="budget"><svg viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg><span>Budget</span></button>
  <button class="tab" data-act="go" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 15c1.6.8 2.6 2.4 3 5"/></svg><span>People</span></button>
</nav>

<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

<noscript><p style="padding:24px">Hisaab needs JavaScript to run. Turn it on in your browser settings and reload.</p></noscript>
<script src="app.js"></script>
</body>
</html>
